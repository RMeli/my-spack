spack:
  specs:
  - dla-future-fortran
  packages:
    all:
      prefer:
      - +mpi
      - ~cuda
      - ~rocm
    mpi:
      require:
      - mpich
    mpich:
      require:
      - device=ch3
      - netmod=tcp
    blas:
      require:
       - openblas
#      - netlib-lapack ~external-blas
    lapack:
      require:
       - openblas
#      - netlib-lapack ~external-blas
    scalapack:
      require:
      - netlib-scalapack
    netlib-scalapack:
      require:
      - '@2.2.2'
    openblas:
      require:
      - threads=none
    intel-oneapi-mkl:
      require:
      - +cluster
      - threads=none
      - +gfortran
  repos:
    dlaf: ~/git/work/DLA-Future/spack/
    dla-future-fortran-repo: ~/git/work/DLA-Future-Fortran/spack/
  develop:
    dla-future-fortran:
      path: ~/git/work/DLA-Future-Fortran
      spec: dla-future-fortran@main +test
    dla-future:
      path: ~/git/work/DLA-Future
      spec: dla-future@master +scalapack +miniapps
    netlib-scalapack:
      path: ~/git/work/scalapack
      spec: netlib-scalapack@2.2.2
  config:
    build_stage: ~/git/work/DLA-Future-Fortran/spack-build-stage/
  view: false
  concretizer:
    unify: true
