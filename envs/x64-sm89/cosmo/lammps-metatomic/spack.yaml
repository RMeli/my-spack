spack:
  specs:
    - libmetatensor@0.1.17
    - libmetatensor-torch@0.8.1
    - libmetatomic-torch@0.1.5
    - py-torch
    - kokkos +wrapper
    - lammps@git.ab8157aa61185e7a51bcf4eb26f062cff748af1d=develop fft_kokkos=cufft +kokkos +metatomic +plumed +extra-command +extra-compute +extra-dump +extra-fix +extra-molecule +extra-pair
    - plumed@2.10 +metatomic
    - mpich
  packages:
    all:
      prefer:
        - +cuda
        - cuda_arch=89
        - +mpi
    py-torch:
      require:
        - ~distributed
        - ~magma
        - ~nccl
        - ~valgrind
        - +custom-protobuf
    blas:
      require: "openblas"
    lapack:
      require: "openblas"
    scalapack:
      require: "netlib-scalapack"
    fftw-api:
      require: "fftw" 
    mpi:
      require:
        - mpich
  view:
    root: ./spack-view
  concretizer:
    unify: true
  repos:
    - ~/git/work/my-spack/repos/cosmo/
