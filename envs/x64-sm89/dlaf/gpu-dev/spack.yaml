spack:
  specs:
  - dla-future
  view: false
  packages:
    all:
      prefer:
      - +mpi
      - +cuda
      - cuda_arch=89
      - ~rocm
      - build_type=Release
    blas:
      require:
      - openblas
    lapack:
      require:
      - openblas
    openblas:
      require:
      - threads=openmp
    scalapack:
      require:
      - netlib-scalapack
    mpi:
      require:
      - mpich
    mpich:
      require:
      #- device=ch3
      #- netmod=tcp
      - device=ch4
      - netmod=ofi
    pika:
      require:
      - +stdexec
      - build_type=RelWithDebInfo
  repos:
    - ~/git/work/DLA-Future/spack/
  concretizer:
    unify: true
  develop:
    dla-future:
      spec: dla-future@master +miniapps +scalapack + hdf5 build_type=RelWithDebInfo
      path: ~/git/work/DLA-Future
  # build_stage is a directory where Spack will build packages
  # Build directories of installed packages are deleted
  # Build directories of develop packages are retained
  config:
    build_stage: ~/git/work/DLA-Future/spack-build-stage/
    ccache: false
