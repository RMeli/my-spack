spack:
  specs:
  - cp2k
  packages:
    all:
      prefer:
        - +cuda
        - cuda_arch=80
        - +mpi
        - build_type=Release
      conflict:
        - +rocm
    mpi:
      require: mpich
    mpich:
      require:
        - "@4"
        - netmod=tcp
        - device=ch3 
        #- netmod=ofi
        #- device=ch4
    blas:
      require: "openblas"
    lapack:
      require: "openblas"
    scalapack:
      require: "netlib-scalapack"
    fftw-api:
      require: "fftw"
    fftw:
      require:
        - "@3:"
    libxc:
      require: 
        - "~cuda"
  view: false
  develop:
    cp2k:
      path: ~/git/work/cp2k/
      spec: cp2k@master +dlaf +libint +libxc +spglib +elpa
  concretizer:
    unify: true
  config:
    build_stage: ~/git/work/cp2k/spack-build-stage
