spack:
  #  repos:
  #- ./repo
  specs:
  - plumed@2.10.0 +pytorch
  packages:
    all:
      prefer:
      - +cuda
      - cuda_arch=89
      - +mpi
    blas:
      require: openblas
    lapack:
      require: openblas
    scalapack:
      require: netlib-scalapack
    fftw-api:
      require: fftw
    mpi:
      require:
      - mpich
    py-torch:
      require:
      - ~nccl
      - ~distributed
  view:
    root: ./spack-view
  concretizer:
    unify: true
